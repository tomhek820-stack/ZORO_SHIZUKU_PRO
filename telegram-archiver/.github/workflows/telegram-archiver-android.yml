name: Build ZORO TELEGRAM ARCHIVER PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'telegram-archiver/android/**'
      - 'telegram-archiver/.github/workflows/telegram-archiver-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: telegram-archiver/android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-TELEGRAM-ARCHIVER-PRO-APK
          if-no-files-found: error
          path: telegram-archiver/android/app/build/outputs/apk/debug/*.apk
