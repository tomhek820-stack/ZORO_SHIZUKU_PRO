name: Build ZORO SHIZUKU PRO

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Git ref from RikkaApps/Shizuku (branch, tag, or commit)"
        required: true
        default: "master"
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZORO build configuration
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Clone upstream Shizuku with submodules
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
        run: |
          # Upstream submodule URLs may use SSH; CI has no SSH deploy key.
          # Rewrite GitHub SSH URLs to HTTPS before cloning submodules.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git clone https://github.com/RikkaApps/Shizuku.git upstream
          cd upstream
          git checkout "$UPSTREAM_REF"
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply ZORO branding
        run: python scripts/brand_upstream.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :manager:assembleDebug

      - name: Upload APK and license
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-SHIZUKU-PRO-DEBUG-APK
          if-no-files-found: error
          path: |
            upstream/manager/build/outputs/apk/debug/*.apk
            upstream/LICENSE
